# Render blueprint — site + riff registry with Postgres.
# https://render.com/docs/blueprint-spec
#
# Domains:
#   site → vaab.dev
#   riff → riff.vaab.dev

databases:
  - name: riff-db
    plan: free
    databaseName: riff
    user: riff

services:
  - type: web
    name: site
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP
        value: site

  - type: web
    name: riff
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP
        value: riff
      - key: RIG_DATABASE_URL
        fromDatabase:
          name: riff-db
          property: connectionString
